[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "glance_volume"
version = "0.1.0"
description = "Analyse or view volume data."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Aaron Watters" }]
dependencies = [
    "numpy",
    "tifffile",
    "zarr",
    "h5py",
    "h5gizmos",
    "neuroglancer",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
volume-triage = "glance_volume.triage:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
